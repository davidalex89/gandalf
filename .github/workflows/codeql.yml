name: CodeQL

# Advanced setup, replacing GitHub's default setup so the query suite and
# scanned paths are chosen here. security-and-quality is a superset of the
# security-extended suite: the same security queries plus code-quality ones.
#
# The "CodeQL" check the ruleset requires is not a job here. GitHub's code
# scanning app posts it after the results upload, and it is the only check
# that fails on findings: the Analyze jobs below succeed whenever analysis
# completes, whatever it finds.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
